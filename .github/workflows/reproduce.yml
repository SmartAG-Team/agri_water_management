name: Reproduce research checks
permissions:
  contents: read
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            comparison_scope: scored
          - os: macos-14
            comparison_scope: all
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/reproduce.py --mode quick
      - run: python scripts/replay_calibration.py --comparison-scope ${{ matrix.comparison_scope }} --output model/reproduction_calibration_ci
      - run: python scripts/refit_water.py --stage check --output model/reproduction_objective_ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduction-checks-${{ matrix.os }}
          path: model/reproduction_*/verification/
