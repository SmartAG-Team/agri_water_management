name: Reproduce research checks
permissions:
  contents: read
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            comparison_scope: scored
          - os: macos-26
            comparison_scope: all
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.5'
          python-version: '3.12.14'
      - run: uv venv --python 3.12.14 .venv
      - run: uv pip install --python .venv/bin/python -r requirements.txt
      - run: .venv/bin/python scripts/reproduce.py --mode quick
      - run: .venv/bin/python scripts/replay_calibration.py --comparison-scope ${{ matrix.comparison_scope }} --output model/reproduction_calibration_ci
      - run: .venv/bin/python scripts/refit_water.py --stage check --output model/reproduction_objective_ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduction-checks-${{ matrix.os }}
          path: model/reproduction_*/verification/
